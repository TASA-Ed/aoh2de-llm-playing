          required: [armies, totalAttackingTroops, defenderCivID]
          properties:
            armies:
              type: array
              items:
                type: object
                required: [attackerCivID, fromProvinceID, toProvinceID, troops]
                properties:
                  attackerCivID: {$ref: '#/components/schemas/CivilizationId'}
                  fromProvinceID: {$ref: '#/components/schemas/ProvinceId'}
                  toProvinceID: {$ref: '#/components/schemas/ProvinceId'}
                  troops: {type: integer, minimum: 0}
