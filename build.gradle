plugins {
    id 'java'
    id 'com.gradleup.shadow' version "8.3.11"
    id 'com.diffplug.spotless' version "8.9.0"
}

group = 'top.tasaed.aoh2de'
version = '0.2.0'

repositories {
    maven {
        url = 'https://maven.aliyun.com/repository/gradle-plugin'
    }
    maven {
        url = 'https://maven.aliyun.com/repository/public'
    }
    maven {
        url = "https://jitpack.io/"
    }
    maven {
        url = "https://plugins.gradle.org/m2/"
    }
    mavenCentral()
}

dependencies {
    shadow fileTree(dir:'libs',includes: ['*.jar'])
    implementation("com.alibaba.fastjson2:fastjson2:2.0.62")
}

spotless {
    java {
        palantirJavaFormat()

        removeUnusedImports() // 自动清理未使用的 import
        formatAnnotations()   // 格式化注解
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

compileTestJava {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

task release {
    description = 'Create a release set of Jars.'
    group = 'build'
    dependsOn clean, shadowJar, sourcesJar
}

tasks.register('lintOpenApi', Exec) {
    group = 'verification'
    description = 'Lints the openapi.yaml using Redocly CLI'

    boolean isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

    if (isWindows) {
        commandLine 'cmd', '/c', 'pnpx', '--package=@redocly/cli', 'redocly', 'lint', 'openapi.yaml', '--skip-rule', 'info-license', '--skip-rule', 'operation-operationId', '--skip-rule', 'operation-4xx-response'
    } else {
        commandLine 'pnpx', '--package=@redocly/cli', 'redocly', 'lint', 'openapi.yaml','--skip-rule', 'info-license', '--skip-rule', 'operation-operationId', '--skip-rule', 'operation-4xx-response'
    }
}
